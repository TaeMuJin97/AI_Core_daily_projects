<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Core Engineer · 인터랙티브 학습 대시보드 허브</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #090d16; color: #f1f5f9; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // ============================================================================
    // 📌 [나중에 새 Day 대시보드를 추가할 때 수정하는 곳!]
    // 새로운 PDF로 HTML을 만들 때마다 status를 "ready"로 바꾸거나 항목을 추가하면 됩니다.
    // ============================================================================
    const DASHBOARDS = [
      {
        day: "Day 17",
        date: "2026.11.10 (화)",
        category: "Backend",
        title: "FastAPI 기초 & JSON 기반 지식 CRUD API",
        desc: "Pydantic 입력 검증, Path/Query 파라미터, HTTP 상태코드(200·201·204·404·422)와 로컬 JSON 저장소 연동",
        tags: ["FastAPI", "Pydantic", "REST API", "JSON"],
        file: "Day17_FastAPI_Dashboard.html",
        status: "pending" // 파일 생성 후 "ready"로 변경!
      },
      {
        day: "Day 18",
        date: "2026.11.11 (수)",
        category: "Database",
        title: "PostgreSQL 관계형 DB 설계 · JOIN · 트랜잭션",
        desc: "1:N 정규화(categories·knowledge), PK/FK/CHECK 제약조건, RETURNING, LEFT JOIN 집계 및 COMMIT/ROLLBACK",
        tags: ["PostgreSQL", "SQL", "ERD", "Transaction"],
        file: "Day18_PostgreSQL_Dashboard.html",
        status: "pending"
      },
      {
        day: "Day 19",
        date: "2026.11.12 (목)",
        category: "Backend",
        title: "FastAPI - PostgreSQL(SQLAlchemy ORM) 통합 연동",
        desc: "Engine/Session 수명주기, Depends(get_db), flush vs commit 원자성 보장, SQLSTATE 예외 변환 및 Alembic Migration",
        tags: ["SQLAlchemy", "ORM", "Alembic", "FastAPI"],
        file: "Day19_ORM_Dashboard.html",
        status: "pending"
      },
      {
        day: "Day 20",
        date: "2026.11.13 (금)",
        category: "LLM / AI",
        title: "LLM 생태계 · Token · Embedding · Self-Attention",
        desc: "Tokenizer 패딩/잘림과 Context 예산, 2D Cosine 유사도, Q/K/V Causal Mask 가중합 수식, Logits & Temperature 시뮬레이터",
        tags: ["LLM", "Tokenizer", "Self-Attention", "PyTorch"],
        file: "Day20_LLM_Dashboard.html",
        status: "ready" // ✅ 현재 생성 완료! 클릭 시 바로 이동합니다.
      },
      {
        day: "Day 21",
        date: "2026.11.16 (월)",
        category: "LLM / AI",
        title: "Prompt Engineering & Context / JSON Schema 검증",
        desc: "System/User 역할 설계, Zero/Few-shot, Context 정보 우선순위 배치 및 구조화된 출력 검증",
        tags: ["Prompt", "Zero/Few-shot", "JSON Schema"],
        file: "Day21_Prompt_Dashboard.html",
        status: "upcoming"
      },
      {
        day: "Day 22~24",
        date: "2026.11.17 ~ 11.20",
        category: "RAG / Agent",
        title: "LLM API · Embedding/Vector DB · Chunking · Basic RAG",
        desc: "외부 지식 문서 청킹 및 임베딩 검색(Retriever)과 LLM 생성을 결합한 End-to-End RAG 파이프라인",
        tags: ["Vector DB", "Embedding", "Chunking", "RAG"],
        file: "Day24_RAG_Dashboard.html",
        status: "upcoming"
      }
    ];

    function HubApp() {
      const [filter, setFilter] = useState("ALL");
      const [search, setSearch] = useState("");

      const categories = ["ALL", "Backend", "Database", "LLM / AI", "RAG / Agent"];

      const filteredList = useMemo(() => {
        return DASHBOARDS.filter(item => {
          const matchCat = filter === "ALL" || item.category === filter;
          const matchSearch =
            item.title.toLowerCase().includes(search.toLowerCase()) ||
            item.desc.toLowerCase().includes(search.toLowerCase()) ||
            item.day.toLowerCase().includes(search.toLowerCase()) ||
            item.tags.some(t => t.toLowerCase().includes(search.toLowerCase()));
          return matchCat && matchSearch;
        });
      }, [filter, search]);

      const readyCount = DASHBOARDS.filter(d => d.status === "ready").length;

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-100 p-6 md:p-12">
          <div className="max-w-6xl mx-auto space-y-8">
            {/* 상단 히어로 배너 */}
            <header className="relative overflow-hidden bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-900 border border-indigo-500/30 rounded-3xl p-8 shadow-2xl">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div className="space-y-2">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 text-xs font-semibold">
                    <span>🚀 AI Core Daily Projects</span>
                    <span>·</span>
                    <span>Interactive Study Archive</span>
                  </div>
                  <h1 className="text-3xl md:text-4xl font-extrabold text-white tracking-tight">
                    생성형 AI · LLM 및 RAG 엔지니어링 대시보드 허브
                  </h1>
                  <p className="text-slate-400 text-sm md:text-base max-w-2xl">
                    FastAPI · PostgreSQL 백엔드 기반부터 LLM 내부 원리(Token, Embedding, Attention)와 RAG Agent까지 직접 조작하며 복습하는 인터랙티브 포트폴리오입니다.
                  </p>
                </div>

                {/* 아카이브 현황 카드 */}
                <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 min-w-[220px] space-y-2">
                  <div className="text-xs text-slate-400 font-medium">활성화된 대시보드</div>
                  <div className="text-3xl font-extrabold text-emerald-400 font-mono">
                    {readyCount} <span className="text-lg text-slate-500">/ {DASHBOARDS.length}</span>
                  </div>
                  <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div
                      className="bg-emerald-500 h-full transition-all duration-300"
                      style={{ width: `${(readyCount / DASHBOARDS.length) * 100}%` }}
                    />
                  </div>
                </div>
              </div>
            </header>

            {/* 로드맵 아키텍처 요약 바 */}
            <section className="grid grid-cols-2 md:grid-cols-4 gap-3">
              {[
                { step: "STEP 01", name: "FastAPI 지식 API", sub: "Day 17 · 입출력 계약", color: "text-sky-400" },
                { step: "STEP 02", name: "PostgreSQL & ORM", sub: "Day 18~19 · 원본 DB 무결성", color: "text-emerald-400" },
                { step: "STEP 03", name: "LLM 내부 원리", sub: "Day 20 · Token·Attention", color: "text-indigo-400" },
                { step: "STEP 04", name: "RAG & AI Agent", sub: "Day 21~24 · 검색·생성·도구", color: "text-amber-400" }
              ].map((s, i) => (
                <div key={i} className="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4">
                  <div className={`text-xs font-bold ${s.color}`}>{s.step}</div>
                  <div className="text-sm font-bold text-white mt-0.5">{s.name}</div>
                  <div className="text-xs text-slate-400 mt-0.5">{s.sub}</div>
                </div>
              ))}
            </section>

            {/* 필터 & 검색바 */}
            <div className="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4">
              <div className="flex flex-wrap gap-2">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setFilter(cat)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                      filter === cat
                        ? "bg-indigo-600 text-white shadow-lg shadow-indigo-600/20"
                        : "bg-slate-900 text-slate-400 border border-slate-800 hover:text-white"
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <input
                type="text"
                placeholder="Day 번호, 키워드(예: Attention, ORM, JOIN) 검색..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 md:w-80"
              />
            </div>

            {/* 대시보드 카드 그리드 */}
            <main className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredList.map((item, idx) => {
                const isReady = item.status === "ready";
                const isPending = item.status === "pending";

                return (
                  <div
                    key={idx}
                    className={`group rounded-2xl border p-6 flex flex-col justify-between transition-all ${
                      isReady
                        ? "bg-slate-900 border-indigo-500/50 hover:border-indigo-400 hover:-translate-y-1 shadow-xl shadow-indigo-950/20"
                        : "bg-slate-900/40 border-slate-800/80 opacity-80 hover:opacity-100"
                    }`}
                  >
                    <div className="space-y-4">
                      {/* 상단 뱃지 */}
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <span className="px-2.5 py-1 rounded-lg bg-indigo-500/20 text-indigo-300 font-bold text-xs">
                            {item.day}
                          </span>
                          <span className="text-xs text-slate-400">{item.date}</span>
                        </div>
                        {isReady ? (
                          <span className="px-2.5 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-[11px] font-bold">
                            ● 제작 완료
                          </span>
                        ) : isPending ? (
                          <span className="px-2.5 py-0.5 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-300 text-[11px] font-semibold">
                            PDF 변환 대기
                          </span>
                        ) : (
                          <span className="px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 text-[11px]">
                            예정 강의
                          </span>
                        )}
                      </div>

                      {/* 제목 및 설명 */}
                      <div>
                        <h2 className="text-lg font-bold text-white group-hover:text-indigo-300 transition">
                          {item.title}
                        </h2>
                        <p className="text-xs text-slate-400 mt-2 leading-relaxed">
                          {item.desc}
                        </p>
                      </div>

                      {/* 태그 */}
                      <div className="flex flex-wrap gap-1.5 pt-1">
                        {item.tags.map((tag, tIdx) => (
                          <span
                            key={tIdx}
                            className="px-2 py-0.5 bg-slate-950 border border-slate-800 rounded text-[11px] text-slate-300 font-mono"
                          >
                            #{tag}
                          </span>
                        ))}
                      </div>
                    </div>

                    {/* 하단 실행 버튼 */}
                    <div className="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between">
                      <span className="text-[11px] font-mono text-slate-500">{item.file}</span>
                      {isReady ? (
                        <a
                          href={`./${item.file}`}
                          className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow-md"
                        >
                          대시보드 열기 →
                        </a>
                      ) : (
                        <a
                          href={`./${item.file}`}
                          className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition"
                        >
                          파일 연결 ({item.day})
                        </a>
                      )}
                    </div>
                  </div>
                );
              })}
            </main>

            {/* 하단 사용 안내 푸터 */}
            <footer className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 text-xs text-slate-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
              <div>
                💡 <strong>새 Day 대시보드 추가 방법:</strong> 새 HTML 파일을 이 폴더(<code className="text-indigo-300">study_dashboards/</code>)에 저장한 뒤, <code className="text-indigo-300">index.html</code> 상단 배열에서 해당 날짜의 <code className="text-emerald-300">status: "ready"</code>로 바꿔주시면 초록색 불이 켜집니다.
              </div>
              <div className="font-mono text-slate-500">AI_Core_daily_projects / study_dashboards</div>
            </footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<HubApp />);
  </script>
</body>
</html>
